version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: boyscouts
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: 'postgresql://postgres:postgres@db:5432/boyscouts?schema=public'
      ADMIN_ACCESS_CODE: 'devcode'
      SESSION_SECRET: 'dev-session-secret'
    depends_on:
      - db
    ports:
      - '4000:4000'
    volumes:
      - ./backend:/usr/src/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - '5173:5173'
    environment:
      VITE_API_BASE: 'http://localhost:4000'
    volumes:
      - ./frontend:/usr/src/app

volumes:
  db-data:
